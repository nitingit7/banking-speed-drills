<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results – Banking Mock Test</title>
  <link rel="stylesheet" href="css/common.css?v=20261018_125625" />
  <link rel="stylesheet" href="css/result.css?v=20261018_125625" />
</head>
<body>

  <!-- Header -->
  <div class="result-header" id="result-header" role="banner">
    <div class="result-header-inner">
      <span class="result-exam-name">Results</span>
    </div>
  </div>

  <!-- Main content -->
  <main class="result-main" role="main">
    <div class="result-inner">

      <!-- Action buttons (top) -->
      <div class="result-card">
        <h3>Your Result</h3>
        <div class="result-actions">
          <button class="btn-result-home" id="btn-home" type="button">🏠 Home</button>
          <button class="btn-result-analyse" id="btn-analyse">🔍 Analyse</button>
        </div>
      </div>

      <!-- Overall score -->
      <div class="result-card" id="result-overall">
        <!-- Rendered by result.js -->
      </div>

      <!-- Section-wise table -->
      <div class="result-card" id="result-sections">
        <!-- Rendered by result.js -->
      </div>

      <!-- Charts -->
      <div class="result-card" id="result-charts">
        <!-- Rendered by result.js -->
      </div>

      <!-- Question time table -->
      <div class="result-card" id="q-time-table">
        <!-- Rendered by result.js -->
      </div>

      <!-- Attempt history (shown if > 1 attempt) -->
      <div class="result-card" id="result-attempt-history">
        <!-- Rendered by result.js -->
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="result-footer" id="result-footer">Version : 17.07.00</footer>

  <!-- Read results through the VM, preserving original result page markup and styling. -->
  <script src="config.js?v=6"></script>
  <script src="js/drill-api.js?v=6"></script>
  <script src="js/drill-result-bridge.js?v=6"></script>
</body>
</html>
